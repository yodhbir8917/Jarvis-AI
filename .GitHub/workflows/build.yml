name: Build Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold App & Build
        run: |
          flutter create app_runner
          cd app_runner
          flutter pub add google_generative_ai speech_to_text flutter_tts intl

          # Code copy
          cp ../JarvisAppFlutter/jarvis.dart lib/main.dart
          sed -i 's/final String apiKey = "get your api";/final String apiKey = "${{ secrets.GEMINI_KEY }}";/g' lib/main.dart

          # OxygenOS & Android 14 manifest configurations
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>' $MANIFEST
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>' $MANIFEST

          # Minimum SDK 23 set karna
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle* || true

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-oneplus-edition
          path: app_runner/build/app/outputs/flutter-apk/app-release.apk
          
